# Native Codex configuration example, checked against official docs 2026-09-09.
# Copy selected settings into .codex/config.toml after trusting the project.
# Preserve the operator's model, approval, sandbox, provider and network policy.
# This example supplies no overrides for those settings.
# https://learn.chatgpt.com/docs/agent-configuration/subagents
# https://learn.chatgpt.com/docs/config-file/config-reference

[agents]
# This limits open spawned-agent threads, excluding the primary thread.
# Reserve verifier room within this cap, or run verification in a later wave.
max_concurrent_threads_per_session = 4

# Copy the sibling codex-agents/*.toml templates to .codex/agents/.
# Current Codex discovers standalone agent files there by their name field.
# Models and reasoning inherit unless an agent file or explicit request sets them.
# Wave budgets, output paths, timeouts and phase gates are orchestration
# conventions. Record them in the task or run ledger, not invented config keys.
